[project]
name = "community-organizer"
version = "0.1.0"
description = "Simple application for organizing volunteer work"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.6.3",
    "django>=6.1.2",
    "django-allauth[socialaccount]>=65.19.7",
    "django-anymail>=15.2",
    "gunicorn>=26.2.0",
    "icalendar>=7.3.0",
    "nh3>=0.3.7",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "sentry-sdk[celery,django]>=2.72.0",
]

[dependency-groups]
dev = [
    "commitizen>=4.19.2",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.0",
]


[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["**/migrations/**", "docs/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
version_scheme = "semver2"
tag_format = "v$version"
# Lets the changelog parser read "## 1.2.0" headings (the template drops the "v").
legacy_tag_formats = ["$version"]
annotated_tag = true
update_changelog_on_bump = true
bump_message = "chore: release $new_version"
template = "scripts/changelog.md.j2"
# Keep a Changelog section names (https://keepachangelog.com).
change_type_order = ["Breaking changes", "Added", "Changed", "Fixed"]

[tool.commitizen.change_type_map]
"BREAKING CHANGE" = "Breaking changes"
feat = "Added"
fix = "Fixed"
refactor = "Changed"
perf = "Changed"
