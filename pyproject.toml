[project]
name = "community-organizer"
version = "0.1.0"
description = "Simple application for organizing volunteer work"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.6.3",
    "django>=6.1.2",
    "django-allauth[socialaccount]>=65.19.7",
    "django-anymail>=15.2",
    "gunicorn>=26.2.0",
    "icalendar>=7.3.0",
    "nh3>=0.3.7",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "sentry-sdk[celery,django]>=2.72.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.0",
]


[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["**/migrations/**", "docs/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
