{% load richtext_tags %}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:16px 0;padding:12px 16px;background:#f9fafb;border-radius:6px;width:100%">
  <tr><td>
    <strong>{{ position.title }}</strong> · {{ event.title }}<br>
    {{ when }}<br>
    {{ place.name }}, {{ place.address_line1 }}, {{ place.city }}, {{ place.region }} {{ place.postal_code }}
    {% if position.description %}<div style="margin-top:8px">{{ position.description|rich_text }}</div>{% endif %}
  </td></tr>
</table>
