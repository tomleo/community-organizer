<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;color:#1f2937">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;margin:0 auto;background:#ffffff;border-radius:8px">
      <tr>
        <td style="padding:24px 24px 0">
          {% if logo_url %}<img src="{{ logo_url }}" alt="" height="40" style="vertical-align:middle;margin-right:8px">{% endif %}
          <strong style="font-size:18px;vertical-align:middle">{{ site_settings.org_name }}</strong>
        </td>
      </tr>
      <tr><td style="padding:16px 24px 24px;font-size:15px;line-height:1.5">{% block content %}{% endblock %}</td></tr>
      <tr>
        <td style="padding:16px 24px;border-top:1px solid #e5e7eb;font-size:12px;color:#6b7280">
          {{ site_settings.org_name }}{% if site_settings.contact_email %} · <a href="mailto:{{ site_settings.contact_email }}">{{ site_settings.contact_email }}</a>{% endif %}{% if site_settings.website_url %} · <a href="{{ site_settings.website_url }}">{{ site_settings.website_url }}</a>{% endif %}
        </td>
      </tr>
    </table>
  </body>
</html>
