{% extends "manage/base.html" %}
{% block head_title %}{% if object %}Edit location{% else %}New location{% endif %}{% endblock head_title %}
{% block content %}
  <h1>{% if object %}Edit {{ object.name }}{% else %}New location{% endif %}</h1>
  <form method="post" class="app-form">
    {% csrf_token %}
    {{ form }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a class="btn btn-link" href="{% url 'manage_locations' %}">Cancel</a>
  </form>
{% endblock content %}
